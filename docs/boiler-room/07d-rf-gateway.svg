<g data-pos="53" data-ref="A4"><title>RF-шлюз: ESP32 + CC1101</title><rect x="60" y="220" width="240" height="400" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="180.0" y="236" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">A4.1 ESP32 DevKit</text><text x="180.0" y="250" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">прошивка esp32-rf-gateway</text><text x="292" y="264" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">3V3</text><circle cx="300" cy="260" r="2.5" fill="#000"/><text x="292" y="304" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">GND</text><circle cx="300" cy="300" r="2.5" fill="#000"/><text x="292" y="344" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">GPIO18</text><circle cx="300" cy="340" r="2.5" fill="#000"/><text x="292" y="384" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">GPIO19</text><circle cx="300" cy="380" r="2.5" fill="#000"/><text x="292" y="424" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">GPIO23</text><circle cx="300" cy="420" r="2.5" fill="#000"/><text x="292" y="464" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">GPIO5</text><circle cx="300" cy="460" r="2.5" fill="#000"/><text x="292" y="504" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">GPIO4</text><circle cx="300" cy="500" r="2.5" fill="#000"/><text x="292" y="544" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">GPIO2</text><circle cx="300" cy="540" r="2.5" fill="#000"/><text x="180" y="585" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">GPIO0 — кнопка BOOT (5 с — сброс настроек)</text><text x="180" y="600" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">GPIO2 — светодиод платы</text><rect x="760" y="220" width="220" height="400" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="870.0" y="236" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">A4.2 CC1101</text><text x="870.0" y="250" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">433,92 МГц, OOK</text><text x="768" y="264" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">VCC</text><circle cx="760" cy="260" r="2.5" fill="#000"/><text x="768" y="304" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">GND</text><circle cx="760" cy="300" r="2.5" fill="#000"/><text x="768" y="344" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">SCK</text><circle cx="760" cy="340" r="2.5" fill="#000"/><text x="768" y="384" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">MISO (GDO1)</text><circle cx="760" cy="380" r="2.5" fill="#000"/><text x="768" y="424" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">MOSI</text><circle cx="760" cy="420" r="2.5" fill="#000"/><text x="768" y="464" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">CSN</text><circle cx="760" cy="460" r="2.5" fill="#000"/><text x="768" y="504" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">GDO0</text><circle cx="760" cy="500" r="2.5" fill="#000"/><text x="768" y="544" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">GDO2</text><circle cx="760" cy="540" r="2.5" fill="#000"/><text x="970" y="284" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">ANT</text><circle cx="980" cy="280" r="2.5" fill="#000"/><rect x="60" y="110" width="240" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="180.0" y="126" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">Блок питания USB 5 В, ≥ 1 А</text><text x="180.0" y="140" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">в разъём USB платы ESP32</text></g>
<path d="M180,160 L180,220" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="186" y="196" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">USB 5 В</text>
<path d="M300,260 L760,260" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="330" y="255" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">питание только 3,3 В</text>
<path d="M300,300 L760,300" fill="none" stroke="#000" stroke-width="1.2"/>
<path d="M300,340 L760,340" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="330" y="335" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">SPI clock</text>
<path d="M300,380 L760,380" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="330" y="375" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">SPI MISO</text>
<path d="M300,420 L760,420" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="330" y="415" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">SPI MOSI</text>
<path d="M300,460 L760,460" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="330" y="455" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">chip select</text>
<path d="M300,500 L760,500" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="330" y="495" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">данные: демодулированный поток (прерывания)</text>
<path d="M300,540 L760,540" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="330" y="535" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">не используется (RSSI) — можно не подключать</text>
<path d="M660,260 L660,278" fill="none" stroke="#000" stroke-width="1.2"/>
<path d="M660,282 L660,300" fill="none" stroke="#000" stroke-width="1.2"/>
<path d="M653,278 H667 M653,282 H667" stroke="#000" stroke-width="1.6"/><text x="660" y="316" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">100 нФ</text>
<path d="M710,260 L710,278" fill="none" stroke="#000" stroke-width="1.2"/>
<path d="M710,282 L710,300" fill="none" stroke="#000" stroke-width="1.2"/>
<path d="M703,278 H717 M703,282 H717" stroke="#000" stroke-width="1.6"/><text x="710" y="316" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">10 мкФ</text>
<text x="685" y="332" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">у самого VCC модуля</text>
<path d="M980,280 L1080,280 L1080,120" fill="none" stroke="#000" stroke-width="1.6"/>
<path d="M1066,120 L1080,100 L1094,120" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="1100" y="150" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">антенна ¼λ — штырь 17,3 см</text><text x="1100" y="166" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">(или спираль на 433 МГц),</text><text x="1100" y="180" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">вертикально, вне металлического щита</text>
<text x="1100" y="380" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">MQTT: home/devices/&lt;имя шлюза&gt;/…</text><text x="1100" y="396" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">sensors — показания привязанных датчиков</text><text x="1100" y="410" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">(tmp, hmt, bat); rf_debug — сырые пакеты</text><text x="1100" y="424" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">для отладки; cmd / ack — настройки с сервера</text>
<text x="30" y="806" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">CC1101 питается только от 3,3 В платы ESP32 (5 В его сожгут); провода SPI — короткие, ≤ 10 см; общий GND.</text>
<text x="30" y="821" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">Шлюз — отдельное устройство (поз. 53), ставится там, где лучше приём от датчиков дома и улицы, не в металлическом щите котельной.</text>
<text x="30" y="836" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">Датчики привязываются с сервера: scan_sensors показывает всё, что слышно (модель, id, канал, RSSI), имя задаётся в админке.</text>
<text x="30" y="851" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">Wi‑Fi и брокер (192.168.55.10:1883) — через Wi‑Fi-портал шлюза, как у контроллера.</text>
<rect x="10" y="10" width="1380" height="880" fill="none" stroke="#000" stroke-width="1.5"/>
<g stroke="#000" stroke-width="1" fill="none"><rect x="1000" y="790" width="390" height="100"/><path d="M1000,820 H1390 M1000,850 H1390 M1300,820 V890 M1180,850 V890"/></g>
<text x="1195" y="811" font-size="12" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">HomeSite — котельная</text>
<text x="1150" y="840" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">RF-шлюз беспроводных датчиков</text>
<text x="1345" y="840" font-size="10" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">Лист 6</text>
<text x="1090" y="875" font-size="10" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">Ред. 2 · 2026-10-17</text>
<text x="1240" y="875" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">docs/boiler-room</text>
</svg>
