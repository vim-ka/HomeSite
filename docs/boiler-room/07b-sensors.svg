<text x="720" y="694" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">предложение для прошивки: вход аварии газа (GPIO39 — input-only, внешняя подтяжка)</text>
<text x="30" y="806" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">GPIO34/35/39 — АЦП1/вход без внутренней подтяжки; АЦП2 при Wi‑Fi не работает — поэтому давление на 34/35.</text>
<text x="30" y="821" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">Датчики давления: питание 5 В, выход уже 0–3,3 В — делитель не нужен. Калибровка — PINOUT.md и раздел 8.</text>
<text x="30" y="836" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">Сигнальные кабели вести отдельно от 230 В (≥ 10 см или в отдельном лотке); экраны — на GND только со стороны A1.</text>
