<text x="360" y="420" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">Кабель — витая пара FTP cat.5e (DATA + GND в одной паре), экран на GND со стороны A1; 3 провода, паразитное питание не применять.</text>
