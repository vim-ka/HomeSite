<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Arial, Helvetica, sans-serif">
<rect width="1400" height="900" fill="#fff"/>
<g data-pos="50" data-ref="A1"><rect x="60" y="270" width="170" height="180" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="145.0" y="286" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">A1 ESP32</text><text x="222" y="324" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">3V3</text><text x="222" y="349" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">GND</text><text x="222" y="384" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">GPIO13 (вход)</text><text x="222" y="414" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">GPIO5 (выход)</text></g>
<g data-pos="52" data-ref="A3"><rect x="370" y="270" width="180" height="170" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="460.0" y="286" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">A3 адаптер OpenTherm</text><text x="460.0" y="300" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">опторазвязка, без полярности</text><text x="378" y="324" font-size="10" text-anchor="start" font-weight="normal" fill="#000" stroke="none">3V3</text><text x="378" y="349" font-size="10" text-anchor="start" font-weight="normal" fill="#000" stroke="none">GND</text><text x="378" y="384" font-size="10" text-anchor="start" font-weight="normal" fill="#000" stroke="none">OUT (приём)</text><text x="378" y="414" font-size="10" text-anchor="start" font-weight="normal" fill="#000" stroke="none">IN (передача)</text><text x="542" y="364" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">OT</text><text x="542" y="394" font-size="10" text-anchor="end" font-weight="bold" fill="#000" stroke="none">OT</text></g>
<path d="M230,320 L370,320" fill="none" stroke="#000" stroke-width="1.2"/>
<path d="M230,345 L370,345" fill="none" stroke="#000" stroke-width="1.2"/>
<path d="M370,380 L230,380" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="250" y="375" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">приём → GPIO13</text>
<path d="M230,410 L370,410" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="250" y="405" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">GPIO5 → передача</text>
<g data-pos="66" data-ref="SA1"><rect x="640" y="300" width="140" height="150" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="710.0" y="316" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">SA1 «Авто / Ручной»</text><text x="710.0" y="330" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">3 полюса</text><circle cx="665" cy="350" r="3" fill="#000"/><circle cx="665" cy="375" r="3" fill="#000"/><circle cx="755" cy="362" r="3" fill="#000"/><path d="M755,362 L668,351" stroke="#000" stroke-width="1.6"/><text x="677" y="343" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">А</text><text x="677" y="392" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">Р</text><text x="710" y="415" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">Р: OT1 котла → перемычка на OT2</text><text x="710" y="435" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">SA1.2, SA1.3 — текст ниже</text></g>
<path d="M550,360 L600,360 L600,350 L665,350" fill="none" stroke="#000" stroke-width="1.2"/>
<path d="M665,375 L652,375 L652,400" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/>
<path d="M550,390 L620,390 L620,400 L850,400 L850,385 L900,385" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="860" y="380" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">OT2</text>
<path d="M755,362 L830,362 L830,350 L900,350" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="860" y="345" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">OT1</text>
<text x="560" y="470" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">OT: витая пара 2×0,75, ≤ 50 м, отдельно от 230 В. Клеммы котла — ТА / OpenTherm (одни и те же — проверить в паспорте).</text>
<g data-pos="1" data-ref="A6"><rect x="900" y="150" width="260" height="300" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1030.0" y="166" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">Котёл (поз. 1), плата A6</text><text x="910" y="204" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">L</text><text x="910" y="229" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">N</text><text x="910" y="254" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">PE</text><text x="910" y="354" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">OT1 / ТА</text><text x="910" y="389" font-size="10" text-anchor="start" font-weight="bold" fill="#000" stroke="none">OT2 / ТА</text><text x="1030" y="290" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">Wi‑Fi производителя — только на</text><text x="1030" y="303" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">отдельном разъёме, не на OT (раздел 5.3)</text></g>
<g data-pos="64" data-ref="G2"><rect x="380" y="150" width="130" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="445.0" y="166" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">G2 ИБП</text><text x="445.0" y="180" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">от QF1</text></g>
<path d="M510,175 L600,175" fill="none" stroke="#000" stroke-width="1.2"/>
<g data-pos="60" data-ref="QF2"><rect x="600" y="157" width="70" height="36" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="635.0" y="173" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">QF2</text><text x="635.0" y="187" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">C6</text></g>
<path d="M670,175 L720,175 L720,200 L900,200" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="880" y="195" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">L</text>
<path d="M720,225 L900,225" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="880" y="220" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">N</text>
<path d="M720,250 L900,250" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="880" y="245" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">PE</text>
<text x="714" y="238" font-size="9" text-anchor="end" font-weight="normal" fill="#000" stroke="none">N, PE — шины XT1 (через ИБП)</text>
<text x="726" y="270" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">фазировка по паспорту (L — к L котла)</text>
<text x="60" y="540" font-size="10" text-anchor="start" font-weight="normal" fill="#000" stroke="none">SA1 в положении «Р» (контроллер неисправен): котёл греет по своей уставке (ручка), SA1.2 подаёт L′ на M1,</text>
<text x="60" y="556" font-size="10" text-anchor="start" font-weight="normal" fill="#000" stroke="none">SA1.3 — на SK1 → M2 в обход реле K1, K2; трёхходовые клапаны выставить вручную (рычаг привода). Котёл без насосов контуров</text>
<text x="60" y="572" font-size="10" text-anchor="start" font-weight="normal" fill="#000" stroke="none">грел бы только гидрострелку — поэтому ручной режим включает и насосы.</text>
<g data-pos="61" data-ref="A5"><rect x="380" y="620" width="200" height="60" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="480.0" y="636" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">A5 сигнализатор</text><text x="480.0" y="650" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">CH₄ под потолком, CO 1,5–1,8 м</text></g>
<g data-pos="33" data-ref="YA4"><rect x="700" y="620" width="200" height="60" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="800.0" y="636" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">YA4 клапан газовый</text><text x="800.0" y="650" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">НО, ручной взвод, на вводе</text></g>
<path d="M580,650 L700,650" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="595" y="643" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">импульс «закрыть»</text>
<path d="M480,680 L480,720 L230,720" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="240" y="714" font-size="9" text-anchor="start" font-weight="normal" fill="#000" stroke="none">сухой контакт → A1 GPIO39 (лист 4)</text>
<text x="30" y="806" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">Нормальный режим (SA1 «А»): уставки котла задаёт A1 по OpenTherm через A3. Приём — GPIO13, не GPIO36/39: на них при работе</text>
<text x="30" y="821" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">АЦП1 (датчики давления) бывают ложные импульсы (errata ESP32), а библиотека OT принимает по прерываниям.</text>
<text x="30" y="836" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">Если у выбранного котла OT и ТА — разные клеммы: перемычку «Р» подать на ТА, OT оставить на A3.</text>
<text x="30" y="851" font-size="9.5" text-anchor="start" font-weight="normal" fill="#000" stroke="none">Котёл, A1, A3, насосы — от ИБП G2: при отключении сети котёл с открытой камерой продолжает работать.</text>
<rect x="10" y="10" width="1380" height="880" fill="none" stroke="#000" stroke-width="1.5"/>
<g stroke="#000" stroke-width="1" fill="none"><rect x="1000" y="790" width="390" height="100"/><path d="M1000,820 H1390 M1000,850 H1390 M1300,820 V890 M1180,850 V890"/></g>
<text x="1195" y="811" font-size="12" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">HomeSite — котельная</text>
<text x="1150" y="840" font-size="11" text-anchor="middle" font-weight="bold" fill="#000" stroke="none">Котёл: питание, OpenTherm, резервный режим</text>
<text x="1345" y="840" font-size="10" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">Лист 5</text>
<text x="1090" y="875" font-size="10" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">Ред. 2 · 2026-10-17</text>
<text x="1240" y="875" font-size="9" text-anchor="middle" font-weight="normal" fill="#000" stroke="none">docs/boiler-room</text>
</svg>
